name: Numeric Jungle
url: 'https://numericjungle.github.io'
description: ""

exclude:
  - vendor
  - Gemfile
  - Gemfile.lock
  - README.md

markdown: kramdown
kramdown:
  math_engine: mathjax
  syntax_highlighter: rouge
  input: kramdown
  options:
    parse_block_html: true

author: 'Sean C'

plugins:
  - jekyll-gist
  - jekyll-sitemap

sass:
    sass_dir: _sass
    style: :compressed

excerpt_separator: "<!--excerpt-->"

