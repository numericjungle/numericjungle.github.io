<!-- Include this in your default layout before the closing </body> tag -->

<script>
    // For Jekyll sites - fixes escaped delimiters after Markdown processing
    document.addEventListener('DOMContentLoaded', function() {
      function looksLikeMath(text) {
        return /\\/.test(text) || /[_^=]/.test(text);
      }

      function convertChatGPTBlocks(html) {
        return html.replace(/\[\s*([\s\S]*?)\s*\]/g, function(match, inner, offset, full) {
          const hasMultiline = match.includes('\n') || /<br\s*\/?\s*>/i.test(match);
          if (!hasMultiline) {
            return match;
          }

          const prevChar = offset === 0 ? '\n' : full[offset - 1];
          const nextChar = full[offset + match.length] || '\n';
          if (prevChar && !/\n|\r|>|\s/.test(prevChar)) {
            return match;
          }
          if (nextChar && !/\n|\r|<|\s/.test(nextChar)) {
            return match;
          }

          let cleaned = inner.replace(/<br\s*\/?\s*>/gi, '\n').trim();
          if (!cleaned || !looksLikeMath(cleaned)) {
            return match;
          }

          return `\n\\[\n${cleaned}\n\\]\n`;
        });
      }
      // Create regex patterns for finding escaped delimiters
      const patterns = [
        // Match escaped block math delimiters: \\[ ... \\]
        {
          find: /\\{2,}\[\s*([\s\S]*?)\s*\\{2,}\]/g,
          replace: function(match, p1) {
            return '\\[' + p1 + '\\]';
          }
        },
        // Match escaped inline math delimiters: \\( ... \\)
        {
          find: /\\{2,}\(\s*([\s\S]*?)\s*\\{2,}\)/g,
          replace: function(match, p1) {
            return '\\(' + p1 + '\\)';
          }
        },
        // Match escaped block math with HTML entities: &bsol;[ ... &bsol;]
        {
          find: /&bsol;\[\s*([\s\S]*?)\s*&bsol;\]/g,
          replace: function(match, p1) {
            return '\\[' + p1 + '\\]';
          }
        },
        // Match escaped inline math with HTML entities: &bsol;( ... &bsol;)
        {
          find: /&bsol;\(\s*([\s\S]*?)\s*&bsol;\)/g,
          replace: function(match, p1) {
            return '\\(' + p1 + '\\)';
          }
        }
      ];
      
      // Get all elements that might contain math
      const elements = document.querySelectorAll('p, li, div, h1, h2, h3, h4, h5, h6');
      
      // Process each element to fix math delimiters
      elements.forEach(function(element) {
        let html = element.innerHTML;
        
        // Apply each pattern replacement
        patterns.forEach(function(pattern) {
          html = html.replace(pattern.find, pattern.replace);
        });

        html = convertChatGPTBlocks(html);
        
        // Update the element content if changes were made
        if (html !== element.innerHTML) {
          element.innerHTML = html;
        }
      });
      
      function requestTypeset() {
        if (typeof MathJax !== 'undefined' && MathJax.typesetPromise) {
          if (typeof MathJax.typesetClear === 'function') {
            MathJax.typesetClear();
          }
          MathJax.typesetPromise();
        } else {
          window.addEventListener('load', function handleLoad() {
            if (typeof MathJax !== 'undefined' && MathJax.typesetPromise) {
              if (typeof MathJax.typesetClear === 'function') {
                MathJax.typesetClear();
              }
              MathJax.typesetPromise();
            }
          }, { once: true });
        }
      }

      requestTypeset();
    });
  </script>
