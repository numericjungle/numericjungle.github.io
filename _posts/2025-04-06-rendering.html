  <h2>Render math & code as images in markdown</h2>
  <textarea id="input">## Example Document

This is a paragraph with inline math $E=mc^2$ and another inline formula \( \alpha + \beta = \gamma \).

### Math Block

Here's a display math equation:

$$
f(x) = \int_{-\infty}^{\infty} \hat{f}(\xi) e^{2\pi i \xi x} d\xi
$$

And another one using different notation:

\[
a_t = \text{Decoder}(s_t, z_t), \quad z_t \sim \text{Diffusion process}
\]

### Code Example

```python
def find_cycle(graph):
    n = len(graph)
    visited = [False] * n
    rec_stack = set()
    index_map = {}
    max_cycle_length = 0
    
    def dfs(node, path, indices):
        nonlocal max_cycle_length
        
        visited[node] = True
        rec_stack.add(node)
        index_map[node] = len(path)
        path.add(node)
        indices[node] = len(path) - 1
        
        for neighbor in graph[node]:
            if not visited[neighbor]:
                result = dfs(neighbor, path.copy(), indices.copy())
                max_cycle_length = max(max_cycle_length, result)
            elif neighbor in rec_stack:
                cycle_length = indices[node] - indices[neighbor] + 1
                max_cycle_length = max(max_cycle_length, cycle_length)
        
        rec_stack.remove(node)
        index_map.pop(node)
        
        return max_cycle_length
    
    for i in range(n):
        if not visited[i]:
            dfs(i, set(), {})
    
    return max_cycle_length

  <br>
  <button id="renderBtn">Render Markdown</button>

  <div id="output"></div>
  
  <!-- Hidden div for rendering -->
  <div id="renderArea"></div>

  <!-- Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.4/dist/katex.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>

  <script>
    // Configure marked to use hljs for syntax highlighting
    marked.setOptions({
      highlight: function(code, lang) {
        const language = hljs.getLanguage(lang) ? lang : 'plaintext';
        return hljs.highlight(code, { language }).value;
      },
      langPrefix: 'hljs language-'
    });
    
    document.getElementById("renderBtn").addEventListener("click", async () => {
      const input = document.getElementById("input").value;
      const output = document.getElementById("output");
      const renderArea = document.getElementById("renderArea");
      
      output.innerHTML = "Processing..."; // Clear previous output
      renderArea.innerHTML = "";
      
      try {
        // First step: Extract and replace math with placeholders
        const mathBlocks = [];
        let processedInput = input;
        
        // Extract block math with $$...$$
        let mathRegex = /(\$\$)([\s\S]*?)(\$\$)/g;
        let match;
        while ((match = mathRegex.exec(input)) !== null) {
          const id = `MATH_BLOCK_${mathBlocks.length}`;
          mathBlocks.push({
            id: id,
            content: match[2].trim(),
            type: 'block',
            original: match[0]
          });
          processedInput = processedInput.replace(match[0], `{{${id}}}`);
        }
        
        // Extract block math with \[...\]
        mathRegex = /(\\\[)([\s\S]*?)(\\\])/g;
        while ((match = mathRegex.exec(input)) !== null) {
          const id = `MATH_BLOCK_${mathBlocks.length}`;
          mathBlocks.push({
            id: id,
            content: match[2].trim(),
            type: 'block',
            original: match[0]
          });
          processedInput = processedInput.replace(match[0], `{{${id}}}`);
        }
        
        // Extract inline math with $...$
        mathRegex = /(\$)([^\$\n]+?)(\$)/g;
        while ((match = mathRegex.exec(input)) !== null) {
          const id = `MATH_INLINE_${mathBlocks.length}`;
          mathBlocks.push({
            id: id,
            content: match[2].trim(),
            type: 'inline',
            original: match[0]
          });
          processedInput = processedInput.replace(match[0], `{{${id}}}`);
        }
        
        // Extract inline math with \(...\)
        mathRegex = /(\\\()([\s\S]*?)(\\\))/g;
        while ((match = mathRegex.exec(input)) !== null) {
          const id = `MATH_INLINE_${mathBlocks.length}`;
          mathBlocks.push({
            id: id,
            content: match[2].trim(),
            type: 'inline',
            original: match[0]
          });
          processedInput = processedInput.replace(match[0], `{{${id}}}`);
        }
        
        // Second step: Extract and replace code blocks with placeholders
        const codeBlocks = [];
        const codeRegex = /```(\w+)?\n([\s\S]*?)```/g;
        while ((match = codeRegex.exec(input)) !== null) {
          const id = `CODE_BLOCK_${codeBlocks.length}`;
          codeBlocks.push({
            id: id,
            language: match[1] || 'plaintext',
            content: match[2].trim(),
            original: match[0]
          });
          processedInput = processedInput.replace(match[0], `{{${id}}}`);
        }
        
        // Third step: Process markdown to HTML
        let html = marked.parse(processedInput);
        
        // Fourth step: Render code blocks to images
        for (const block of codeBlocks) {
          renderArea.innerHTML = "";
          
          const pre = document.createElement("pre");
          const codeEl = document.createElement("code");
          codeEl.className = `language-${block.language}`;
          codeEl.textContent = block.content;
          pre.appendChild(codeEl);
          
          renderArea.appendChild(pre);
          hljs.highlightElement(codeEl);
          
          await new Promise(resolve => setTimeout(resolve, 100));
          
          try {
            const img = await toImage(pre);
            img.alt = `Code block in ${block.language}`;
            img.style.maxWidth = "100%";
            
            html = html.replace(
              `{{${block.id}}}`, 
              `<div class="code-block">${img.outerHTML}</div>`
            );
          } catch (err) {
            console.error("Error rendering code block:", err);
            html = html.replace(
              `{{${block.id}}}`, 
              `<div class="debug">Error rendering code: ${err.message}</div>`
            );
          }
        }
        
        // Fifth step: Render math to images
        for (const block of mathBlocks) {
          renderArea.innerHTML = "";
          
          const mathDiv = document.createElement("div");
          try {
            katex.render(block.content, mathDiv, { 
              displayMode: block.type === 'block',
              throwOnError: false
            });
            
            renderArea.appendChild(mathDiv);
            
            await new Promise(resolve => setTimeout(resolve, 100));
            
            const img = await toImage(mathDiv);
            img.alt = `Math: ${block.content.replace(/\s+/g, ' ')}`;
            
            if (block.type === 'inline') {
              img.className = "inline-math";
              img.style.verticalAlign = "middle";
              img.style.height = "1.2em";
            }
            
            html = html.replace(
              `{{${block.id}}}`,
              block.type === 'block' 
                ? `<div class="math-block">${img.outerHTML}</div>`
                : img.outerHTML
            );
          } catch (err) {
            console.error("Error rendering math:", err);
            html = html.replace(
              `{{${block.id}}}`,
              `<span class="debug">Math Error: ${err.message}</span>`
            );
          }
        }
        
        // Final step: Output HTML
        output.innerHTML = html;
        
      } catch (error) {
        console.error("Error processing document:", error);
        output.innerHTML = `<div class="debug">Error: ${error.message}</div>`;
      }
    });

    async function toImage(element) {
      try {
        await new Promise(resolve => setTimeout(resolve, 100));
        
        const canvas = await html2canvas(element, {
          allowTaint: true,
          useCORS: true,
          logging: false,
          backgroundColor: null,
          scale: 2 // Higher resolution
        });
        
        const img = new Image();
        img.src = canvas.toDataURL("image/png");
        return img;
      } catch (error) {
        console.error("Error in toImage:", error);
        throw error;
      }
    }
  </script>
</body>
