# Local development overrides.
# Jekyll's multi-config loading REPLACES arrays (not merges), so this file must
# repeat every entry from _config.yml's exclude list and add the large data dirs.
# Without carrying vendor forward, Jekyll would process all 98 installed gems.

exclude:
  - .bundle
  - vendor
  - node_modules
  - __pycache__
  - .github
  - Gemfile
  - Gemfile.lock
  - README.md
  - SETUP_DEV_ENVIRONMENT.md
  - convert_math_delimiters.py
  - new_post.py
  - post.sh
  - run-server.sh
  - package.json
  - package-lock.json
  - scrapers
  - tmp_rovodev_server_output.log
  - convnetjs/demo/cifar10
  - convnetjs/demo/mnist
  - convnetjs/demo/cifar10_parse.zip
  - convnetjs/demo/mnist_parse.zip

# Preserve the data dirs in _site between builds so the serve step can
# access them via the symlinks that run-server.sh creates on first run.
keep_files:
  - convnetjs/demo/cifar10
  - convnetjs/demo/mnist

gist:
  noscript: false
