<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#0d0d1a;color:#cbd5e1;padding:10px}
#app{max-width:820px;margin:0 auto}
.ctrl{display:flex;flex-wrap:wrap;gap:12px;align-items:center;background:#141426;border-radius:8px;padding:10px 14px;margin-bottom:8px}
.sg{display:flex;flex-direction:column;gap:3px;min-width:150px}
.sg label{font-size:12px;color:#94a3b8}
.sg label b{color:#7dd3fc}
input[type=range]{width:100%;accent-color:#7dd3fc}
.badge{background:#101830;border:1px solid #f0c040;color:#f0c040;border-radius:5px;padding:4px 12px;font-size:13px}
.btn{background:transparent;border:1px solid #7dd3fc66;color:#bae6fd;border-radius:5px;padding:5px 14px;cursor:pointer;font-size:12px}
.btn:hover{border-color:#7dd3fc;color:#e0f2fe}
.layout{display:grid;grid-template-columns:1.45fr 1fr;gap:8px}
@media(max-width:760px){.layout{grid-template-columns:1fr}}
canvas{display:block;width:100%;border-radius:8px;background:#080816}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:#94a3b8;margin:6px 0 2px}
.li{display:flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:50%}
.info{background:#141426;border-radius:8px;padding:10px 14px;margin-top:8px;font-size:12px;line-height:1.7;color:#94a3b8}
.warn{background:#321010;border:1px solid #ff7b72;color:#fecdd3;border-radius:6px;padding:7px 12px;font-size:12px;margin-bottom:8px;display:none}
.warn.on{display:block}
</style>

<div id="app">
  <div class="ctrl">
    <div class="sg">
      <label>GD learning rate <b id="lrv">0.0015</b></label>
      <input type="range" id="lr" min="0.0004" max="0.0040" step="0.0001" value="0.0015">
    </div>
    <div class="sg">
      <label>Damping lambda <b id="dv">3.0</b></label>
      <input type="range" id="damp" min="0.0" max="12.0" step="0.2" value="3.0">
    </div>
    <div class="sg">
      <label>Steps/sec <b id="spv">14</b></label>
      <input type="range" id="speed" min="2" max="30" step="1" value="14">
    </div>
    <div class="badge" id="status">step 0</div>
    <button class="btn" id="play">Play</button>
    <button class="btn" id="reset">Reset</button>
  </div>

  <div class="warn" id="warn">The Hessian is nearly singular or indefinite here. Pure Newton can point somewhere surprising; damping acts like a trust region.</div>

  <div class="legend">
    <div class="li"><span class="dot" style="background:#7dd3fc"></span>Gradient descent</div>
    <div class="li"><span class="dot" style="background:#f0c040"></span>Newton</div>
    <div class="li"><span class="dot" style="background:#34d399"></span>Damped Newton</div>
  </div>

  <div class="layout">
    <canvas id="traj" width="500" height="390"></canvas>
    <canvas id="loss" width="300" height="390"></canvas>
  </div>

  <div class="info" id="info"></div>
</div>

<script>
(function(){
  const traj = document.getElementById('traj');
  const tctx = traj.getContext('2d');
  const lossCv = document.getElementById('loss');
  const lctx = lossCv.getContext('2d');
  const bg = document.createElement('canvas');
  bg.width = traj.width;
  bg.height = traj.height;
  const bgx = bg.getContext('2d');

  const colors = ['#7dd3fc', '#f0c040', '#34d399'];
  const labels = ['GD', 'Newton', 'Damped Newton'];
  const bounds = {xmin:-2.0,xmax:2.0,ymin:-1.0,ymax:3.0};

  let gdLr = 0.0015;
  let damp = 3.0;
  let speed = 14;
  let running = false;
  let step = 0;
  let lastFrame = null;
  let states = [];

  function f(theta){
    const x = theta[0];
    const y = theta[1];
    return 100 * Math.pow(y - x * x, 2) + Math.pow(1 - x, 2);
  }

  function grad(theta){
    const x = theta[0];
    const y = theta[1];
    return [
      -400 * x * (y - x * x) - 2 * (1 - x),
      200 * (y - x * x)
    ];
  }

  function hessian(theta){
    const x = theta[0];
    const y = theta[1];
    return [
      [1200 * x * x - 400 * y + 2, -400 * x],
      [-400 * x, 200]
    ];
  }

  function solve2x2(M, g){
    const det = M[0][0] * M[1][1] - M[0][1] * M[1][0];
    if(Math.abs(det) < 1e-9) return {step:[0,0], det};
    return {
      step: [
        ( M[1][1] * g[0] - M[0][1] * g[1]) / det,
        (-M[1][0] * g[0] + M[0][0] * g[1]) / det
      ],
      det
    };
  }

  function rebuildBackground(){
    bgx.fillStyle = '#080816';
    bgx.fillRect(0,0,bg.width,bg.height);
    const cellsX = 90;
    const cellsY = 76;
    const dx = (bounds.xmax - bounds.xmin) / cellsX;
    const dy = (bounds.ymax - bounds.ymin) / cellsY;
    let lo = Infinity;
    let hi = -Infinity;
    const vals = [];
    for(let i = 0; i < cellsX; i++){
      vals[i] = [];
      for(let j = 0; j < cellsY; j++){
        const x = bounds.xmin + (i + 0.5) * dx;
        const y = bounds.ymin + (j + 0.5) * dy;
        const v = Math.log(f([x, y]) + 1e-4);
        vals[i][j] = v;
        lo = Math.min(lo, v);
        hi = Math.max(hi, v);
      }
    }
    const span = Math.max(0.7, hi - lo);
    for(let i = 0; i < cellsX; i++){
      for(let j = 0; j < cellsY; j++){
        const t = (vals[i][j] - lo) / span;
        const r = Math.floor(12 + 44 * t);
        const g = Math.floor(18 + 26 * t);
        const b = Math.floor(30 + 84 * (1 - t));
        bgx.fillStyle = 'rgb(' + r + ',' + g + ',' + b + ')';
        const x0 = mapX(bounds.xmin + i * dx);
        const x1 = mapX(bounds.xmin + (i + 1) * dx);
        const y0 = mapY(bounds.ymin + j * dy);
        const y1 = mapY(bounds.ymin + (j + 1) * dy);
        bgx.fillRect(x0, y1, x1 - x0 + 1, y0 - y1 + 1);
      }
    }
    bgx.strokeStyle = '#26304d';
    bgx.lineWidth = 1;
    for(let i = -2; i <= 2; i++){
      const x = mapX(i);
      bgx.beginPath();
      bgx.moveTo(x, 0);
      bgx.lineTo(x, bg.height);
      bgx.stroke();
    }
    for(let i = -1; i <= 3; i++){
      const y = mapY(i);
      bgx.beginPath();
      bgx.moveTo(0, y);
      bgx.lineTo(bg.width, y);
      bgx.stroke();
    }
    const ox = mapX(1);
    const oy = mapY(1);
    bgx.strokeStyle = '#f8fafc';
    bgx.lineWidth = 1.6;
    bgx.beginPath();
    bgx.moveTo(ox - 5, oy);
    bgx.lineTo(ox + 5, oy);
    bgx.moveTo(ox, oy - 5);
    bgx.lineTo(ox, oy + 5);
    bgx.stroke();
  }

  function mapX(x){
    return (x - bounds.xmin) / (bounds.xmax - bounds.xmin) * traj.width;
  }

  function mapY(y){
    return traj.height - (y - bounds.ymin) / (bounds.ymax - bounds.ymin) * traj.height;
  }

  function reset(){
    running = false;
    lastFrame = null;
    step = 0;
    const start = [-1.4, 1.6];
    states = labels.map(function(){ return {theta:start.slice(), traj:[start.slice()], losses:[f(start)]}; });
    document.getElementById('play').textContent = 'Play';
    draw();
  }

  function advanceOne(){
    const gd = states[0];
    const gg = grad(gd.theta);
    gd.theta[0] -= gdLr * gg[0];
    gd.theta[1] -= gdLr * gg[1];

    const nw = states[1];
    const gn = grad(nw.theta);
    const Hn = hessian(nw.theta);
    const sn = solve2x2(Hn, gn).step;
    nw.theta[0] -= sn[0];
    nw.theta[1] -= sn[1];

    const dn = states[2];
    const gdamp = grad(dn.theta);
    const Hd = hessian(dn.theta);
    const damped = [
      [Hd[0][0] + damp, Hd[0][1]],
      [Hd[1][0], Hd[1][1] + damp]
    ];
    const sd = solve2x2(damped, gdamp).step;
    dn.theta[0] -= sd[0];
    dn.theta[1] -= sd[1];

    for(const state of states){
      state.traj.push(state.theta.slice());
      state.losses.push(f(state.theta));
      if(state.traj.length > 180) state.traj.shift();
      if(state.losses.length > 180) state.losses.shift();
    }
    step++;
  }

  function drawArrow(x0, y0, dx, dy, color){
    const scale = 0.25 / Math.max(1e-6, Math.hypot(dx, dy));
    const x1 = x0 + dx * scale;
    const y1 = y0 + dy * scale;
    const px0 = mapX(x0);
    const py0 = mapY(y0);
    const px1 = mapX(x1);
    const py1 = mapY(y1);
    tctx.strokeStyle = color;
    tctx.fillStyle = color;
    tctx.lineWidth = 1.8;
    tctx.beginPath();
    tctx.moveTo(px0, py0);
    tctx.lineTo(px1, py1);
    tctx.stroke();
    const ang = Math.atan2(py1 - py0, px1 - px0);
    tctx.beginPath();
    tctx.moveTo(px1, py1);
    tctx.lineTo(px1 - 7 * Math.cos(ang - 0.35), py1 - 7 * Math.sin(ang - 0.35));
    tctx.lineTo(px1 - 7 * Math.cos(ang + 0.35), py1 - 7 * Math.sin(ang + 0.35));
    tctx.fill();
  }

  function drawTraj(){
    tctx.drawImage(bg, 0, 0);
    tctx.fillStyle = '#9aa5c1';
    tctx.font = '11px monospace';
    tctx.fillText('Rosenbrock valley', 8, 16);
    for(let i = 0; i < states.length; i++){
      const state = states[i];
      tctx.strokeStyle = colors[i];
      tctx.lineWidth = 1.8;
      tctx.beginPath();
      state.traj.forEach(function(p, idx){
        const x = mapX(p[0]);
        const y = mapY(p[1]);
        if(idx === 0) tctx.moveTo(x, y);
        else tctx.lineTo(x, y);
      });
      tctx.stroke();
      const cur = state.traj[state.traj.length - 1];
      tctx.shadowColor = colors[i];
      tctx.shadowBlur = 10;
      tctx.fillStyle = colors[i];
      tctx.beginPath();
      tctx.arc(mapX(cur[0]), mapY(cur[1]), 5.5, 0, Math.PI * 2);
      tctx.fill();
      tctx.shadowBlur = 0;
    }

    const cur = states[1].theta;
    const g = grad(cur);
    const H = hessian(cur);
    const ns = solve2x2(H, g).step;
    drawArrow(cur[0], cur[1], -g[0], -g[1], '#7dd3fc');
    drawArrow(cur[0], cur[1], -ns[0], -ns[1], '#f0c040');
  }

  function drawLosses(){
    const W = lossCv.width;
    const H = lossCv.height;
    const pad = {l:42,r:10,t:18,b:24};
    lctx.fillStyle = '#080816';
    lctx.fillRect(0,0,W,H);
    lctx.fillStyle = '#9aa5c1';
    lctx.font = '11px monospace';
    lctx.fillText('loss (log scale)', 8, 14);
    const all = states.flatMap(function(s){ return s.losses; });
    const lo = Math.log(Math.max(1e-8, Math.min.apply(null, all)));
    const hi = Math.log(Math.max.apply(null, all) + 1e-8);
    const span = Math.max(0.8, hi - lo);
    lctx.strokeStyle = '#253250';
    lctx.lineWidth = 1;
    for(let i = 0; i < 5; i++){
      const y = pad.t + (H - pad.t - pad.b) * i / 4;
      lctx.beginPath();
      lctx.moveTo(pad.l, y);
      lctx.lineTo(W - pad.r, y);
      lctx.stroke();
    }
    lctx.beginPath();
    lctx.moveTo(pad.l, pad.t);
    lctx.lineTo(pad.l, H - pad.b);
    lctx.lineTo(W - pad.r, H - pad.b);
    lctx.stroke();
    function px(i, n){
      return pad.l + (W - pad.l - pad.r) * i / Math.max(1, n - 1);
    }
    function py(v){
      return pad.t + (H - pad.t - pad.b) * (hi - Math.log(v + 1e-8)) / span;
    }
    for(let i = 0; i < states.length; i++){
      lctx.strokeStyle = colors[i];
      lctx.lineWidth = 1.8;
      lctx.beginPath();
      states[i].losses.forEach(function(v, idx){
        if(idx === 0) lctx.moveTo(px(idx, states[i].losses.length), py(v));
        else lctx.lineTo(px(idx, states[i].losses.length), py(v));
      });
      lctx.stroke();
    }
    lctx.fillStyle = '#64748b';
    lctx.fillText('step ' + step, W - 64, H - 6);
  }

  function eigvals2(M){
    const tr = M[0][0] + M[1][1];
    const det = M[0][0] * M[1][1] - M[0][1] * M[1][0];
    const disc = Math.max(0, tr * tr - 4 * det);
    const root = Math.sqrt(disc);
    return [(tr - root) / 2, (tr + root) / 2];
  }

  function draw(){
    drawTraj();
    drawLosses();
    document.getElementById('status').textContent = 'step ' + step;
    const H = hessian(states[1].theta);
    const det = H[0][0] * H[1][1] - H[0][1] * H[1][0];
    const eig = eigvals2(H);
    document.getElementById('warn').className = (det < 0 || eig[0] < 0.5) ? 'warn on' : 'warn';
    const rows = states.map(function(state, i){
      return '<span style="color:' + colors[i] + '"><b>' + labels[i] + '</b></span>: ' +
        state.losses[state.losses.length - 1].toExponential(2);
    }).join('<br>');
    document.getElementById('info').innerHTML =
      '<b>Newton Hessian eigenvalues</b>: [' + eig[0].toFixed(2) + ', ' + eig[1].toFixed(2) + ']' +
      ' &nbsp;|&nbsp; <b>det(H)</b>: ' + det.toFixed(2) +
      ' &nbsp;|&nbsp; <b>damping</b>: ' + damp.toFixed(1) +
      '<br>' + rows +
      '<br>The blue arrow is the raw negative gradient, which mostly points across the banana-shaped valley. The gold arrow is the Newton step, which rescales by curvature and therefore bends toward the valley floor. In deep learning, the problem is not the formula but storing and inverting the full Hessian.';
  }

  function loop(ts){
    if(!running) return;
    if(lastFrame == null) lastFrame = ts;
    const want = Math.floor((ts - lastFrame) / 1000 * speed);
    if(want > 0){
      const n = Math.min(want, 6);
      for(let i = 0; i < n; i++) advanceOne();
      lastFrame = ts;
      draw();
    }
    requestAnimationFrame(loop);
  }

  function sync(){
    gdLr = +document.getElementById('lr').value;
    damp = +document.getElementById('damp').value;
    speed = +document.getElementById('speed').value;
    document.getElementById('lrv').textContent = gdLr.toFixed(4);
    document.getElementById('dv').textContent = damp.toFixed(1);
    document.getElementById('spv').textContent = speed.toFixed(0);
    reset();
  }

  document.getElementById('lr').addEventListener('input', sync);
  document.getElementById('damp').addEventListener('input', sync);
  document.getElementById('speed').addEventListener('input', function(){
    speed = +document.getElementById('speed').value;
    document.getElementById('spv').textContent = speed.toFixed(0);
  });
  document.getElementById('play').addEventListener('click', function(){
    running = !running;
    document.getElementById('play').textContent = running ? 'Pause' : 'Play';
    if(running){
      lastFrame = null;
      requestAnimationFrame(loop);
    }
  });
  document.getElementById('reset').addEventListener('click', reset);

  rebuildBackground();
  sync();
})();
</script>
