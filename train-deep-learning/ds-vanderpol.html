<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#0d0d1a;color:#ccc;padding:10px}
#app{max-width:760px;margin:0 auto}
.ctrl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:#141426;border-radius:8px;padding:10px 14px;margin-bottom:8px}
.sg{display:flex;flex-direction:column;gap:3px;min-width:130px}
.sg label{font-size:12px;color:#888}.sg label b{color:#7ec8ff}
input[type=range]{width:100%;accent-color:#7ec8ff}
.btn{background:transparent;border:1px solid #7ec8ff66;color:#7ec8ffaa;border-radius:5px;padding:5px 12px;cursor:pointer;font-size:12px}
.btn:hover{border-color:#7ec8ff;color:#7ec8ff}
.canvrow{display:flex;gap:6px}
canvas{display:block;border-radius:8px}
#pp{flex:1;min-width:0}
#ts{width:100%;border-radius:8px;margin-top:6px}
.info{background:#141426;border-radius:8px;padding:8px 14px;font-size:12px;color:#888;line-height:1.7}
</style>
<div id="app">
  <div class="ctrl">
    <div class="sg">
      <label>Damping μ = <b id="muv">1.50</b></label>
      <input type="range" id="smu" min="0" max="4" step="0.05" value="1.5">
    </div>
    <div class="sg">
      <label>IC x₀ = <b id="x0v">0.50</b></label>
      <input type="range" id="sx0" min="-3" max="3" step="0.1" value="0.5">
    </div>
    <div class="sg">
      <label>IC y₀ = <b id="y0v">0.00</b></label>
      <input type="range" id="sy0" min="-3" max="3" step="0.1" value="0">
    </div>
    <div class="sg">
      <label>Speed <b id="spv">2</b>×</label>
      <input type="range" id="ssp" min="1" max="8" step="1" value="2">
    </div>
    <button class="btn" id="rst">↺ Reset</button>
  </div>
  <div class="canvrow">
    <canvas id="pp" width="420" height="420"></canvas>
    <canvas id="ts" width="320" height="420"></canvas>
  </div>
  <div class="info" id="info">—</div>
</div>
<script>
const pp=document.getElementById('pp'),pc=pp.getContext('2d');
const ts=document.getElementById('ts'),tc=ts.getContext('2d');
const PPW=420,PPH=420,TSW=320,TSH=420;

let mu=1.5,x0=0.5,y0=0,spd=2;
let x,y,simT,history,tsData;
const XMIN=-4,XMAX=4,YMIN=-4,YMAX=4;
const TSW_PAD=36,TSH_PAD=20;

function mpx(v){return 20+(v-XMIN)/(XMAX-XMIN)*(PPW-40);}
function mpy(v){return 20+(1-(v-YMIN)/(YMAX-YMIN))*(PPH-40);}

function init(){
  x=x0;y=y0;simT=0;
  history=[[x,y]];tsData=[];
}

function rk4(x,y,dt){
  const f=(x,y)=>[y, mu*(1-x*x)*y-x];
  const [k1x,k1y]=f(x,y);
  const [k2x,k2y]=f(x+dt/2*k1x,y+dt/2*k1y);
  const [k3x,k3y]=f(x+dt/2*k2x,y+dt/2*k2y);
  const [k4x,k4y]=f(x+dt*k3x,y+dt*k3y);
  return[x+dt*(k1x+2*k2x+2*k3x+k4x)/6, y+dt*(k1y+2*k2y+2*k3y+k4y)/6];
}

function drawPhase(){
  pc.clearRect(0,0,PPW,PPH);pc.fillStyle='#0d0d1a';pc.fillRect(0,0,PPW,PPH);
  // Grid
  pc.strokeStyle='#131326';pc.lineWidth=1;
  for(let v=-3;v<=3;v++){
    pc.beginPath();pc.moveTo(mpx(v),20);pc.lineTo(mpx(v),PPH-20);pc.stroke();
    pc.beginPath();pc.moveTo(20,mpy(v));pc.lineTo(PPW-20,mpy(v));pc.stroke();
  }
  // Axes
  pc.strokeStyle='#252540';pc.lineWidth=1.5;
  pc.beginPath();pc.moveTo(20,mpy(0));pc.lineTo(PPW-20,mpy(0));pc.stroke();
  pc.beginPath();pc.moveTo(mpx(0),20);pc.lineTo(mpx(0),PPH-20);pc.stroke();
  // Labels
  pc.fillStyle='#3a3a60';pc.font='11px monospace';pc.textAlign='center';
  [-3,-2,-1,1,2,3].forEach(v=>pc.fillText(v,mpx(v),PPH-6));
  pc.textAlign='right';
  [-3,-2,-1,1,2,3].forEach(v=>pc.fillText(v,17,mpy(v)+4));
  pc.fillStyle='#3a3a60';pc.font='11px sans-serif';
  pc.textAlign='center';pc.fillText('x',PPW/2,PPH-1);
  pc.save();pc.translate(8,PPH/2);pc.rotate(-Math.PI/2);pc.fillText('ẋ',0,0);pc.restore();

  // Trajectory
  if(history.length>1){
    const maxAge=history.length;
    for(let i=1;i<history.length;i++){
      const age=i/maxAge;
      pc.strokeStyle=`hsla(${160+60*age},80%,55%,${age*0.8})`;
      pc.lineWidth=1.5;
      pc.beginPath();pc.moveTo(mpx(history[i-1][0]),mpy(history[i-1][1]));
      pc.lineTo(mpx(history[i][0]),mpy(history[i][1]));pc.stroke();
    }
  }
  // Current dot
  pc.beginPath();pc.arc(mpx(x),mpy(y),6,0,2*Math.PI);
  pc.fillStyle='#f0c040';pc.shadowColor='#f0c040';pc.shadowBlur=12;pc.fill();pc.shadowBlur=0;

  // Title
  pc.fillStyle='#555';pc.font='11px monospace';pc.textAlign='left';
  pc.fillText('Phase portrait (x, ẋ)',22,14);
}

function drawTimeSeries(){
  tc.clearRect(0,0,TSW,TSH);tc.fillStyle='#0d0d1a';tc.fillRect(0,0,TSW,TSH);
  const W=TSW-TSW_PAD-10,H=(TSH-TSH_PAD*2-30)/2;
  const splitY=TSH_PAD+H+20;
  // Axes
  ['#7ec8ff','#ff6688'].forEach((col,ci)=>{
    const top=ci===0?TSH_PAD:splitY;
    tc.strokeStyle='#252540';tc.lineWidth=1;
    tc.beginPath();tc.moveTo(TSW_PAD,top);tc.lineTo(TSW_PAD+W,top+H);tc.stroke();
    tc.beginPath();tc.moveTo(TSW_PAD,top);tc.lineTo(TSW_PAD,top+H);tc.stroke();
    tc.beginPath();tc.moveTo(TSW_PAD,top+H/2);tc.lineTo(TSW_PAD+W,top+H/2);tc.stroke();
    tc.fillStyle=col;tc.font='10px monospace';tc.textAlign='right';
    tc.fillText(ci===0?'x(t)':'ẋ(t)',TSW_PAD-2,top+6);
  });
  // Plot x(t) and y(t)
  if(tsData.length>2){
    const N=tsData.length;
    [[0,'#7ec8ff',TSH_PAD],[1,'#ff6688',splitY]].forEach(([idx,col,top])=>{
      const vals=tsData.map(d=>d[idx]);
      const mx=Math.max(Math.abs(Math.min(...vals)),Math.abs(Math.max(...vals)),0.5);
      tc.strokeStyle=col;tc.lineWidth=1.5;tc.beginPath();
      tsData.forEach((d,i)=>{
        const xp=TSW_PAD+i/N*W;
        const yp=top+H/2-d[idx]/mx*H*0.45;
        i===0?tc.moveTo(xp,yp):tc.lineTo(xp,yp);
      });
      tc.stroke();
    });
  }
  tc.fillStyle='#555';tc.font='11px monospace';tc.textAlign='left';
  tc.fillText('Time series',TSW_PAD,13);
  tc.fillStyle='#444';tc.font='10px monospace';
  tc.fillText(`t=${simT.toFixed(1)}`,TSW_PAD,TSH-6);
}

let lastT=null;
function frame(t){
  if(lastT===null) lastT=t;
  const rdt=Math.min((t-lastT)/1000,0.05);
  lastT=t;
  const dt=0.015;
  const steps=Math.round(rdt/dt*spd);
  for(let k=0;k<Math.min(steps,60);k++){
    [x,y]=rk4(x,y,dt);
    simT+=dt;
    history.push([x,y]);
    tsData.push([x,y]);
    if(history.length>800) history.shift();
    if(tsData.length>400) tsData.shift();
  }
  drawPhase();drawTimeSeries();
  // Info
  const period=mu<0.1?'≈ 2π (μ→0)':'—';
  document.getElementById('info').innerHTML=
    `μ = ${mu.toFixed(2)} &nbsp;|&nbsp; x = ${x.toFixed(3)} &nbsp;|&nbsp; ẋ = ${y.toFixed(3)} &nbsp;|&nbsp; t = ${simT.toFixed(1)}<br>`+
    (mu>0?'<span style="color:#50dd80">Limit cycle exists</span> — trajectories spiral toward it from any IC.'
          :'<span style="color:#7ec8ff">μ = 0: simple harmonic oscillator (conservative, concentric circles).</span>');
  requestAnimationFrame(frame);
}

function sync(){
  mu=+document.getElementById('smu').value;
  x0=+document.getElementById('sx0').value;
  y0=+document.getElementById('sy0').value;
  spd=+document.getElementById('ssp').value;
  document.getElementById('muv').textContent=mu.toFixed(2);
  document.getElementById('x0v').textContent=x0.toFixed(2);
  document.getElementById('y0v').textContent=y0.toFixed(2);
  document.getElementById('spv').textContent=spd;
}

document.getElementById('rst').addEventListener('click',()=>{sync();init();});
['smu','sx0','sy0','ssp'].forEach(id=>document.getElementById(id).addEventListener('input',sync));

sync();init();requestAnimationFrame(frame);
</script>
